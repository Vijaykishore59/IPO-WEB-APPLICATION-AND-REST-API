services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bluestock_ipo
      MYSQL_USER: bluestock
      MYSQL_PASSWORD: bluestock_password
      MYSQL_ROOT_PASSWORD: root_password
    ports: ["3306:3306"]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ubluestock", "-pbluestock_password"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://bluestock:bluestock_password@mysql:3306/bluestock_ipo
      SECRET_KEY: replace-in-production
      CORS_ORIGINS: http://localhost:5173
      ADMIN_EMAIL: admin@bluestock.local
      ADMIN_PASSWORD: Admin@12345
    ports: ["8000:8000"]
    volumes: ["./backend/uploads:/app/uploads"]
    depends_on:
      mysql:
        condition: service_healthy
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    volumes: ["./frontend:/app", "/app/node_modules"]
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    depends_on: [backend]
volumes:
  mysql_data:
